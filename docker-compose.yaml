services:
  nginx:
    image: nginx:alpine
    ports: 
      - "80:80"
    volumes:
      - ./docker/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - backend
    container_name: gladkix_nginx_dev
    networks:
      - gladkix_network

  backend:
    build:
      context: ./
      dockerfile: ./docker/dev/backend/Dockerfile
    volumes:
      - ./backend:/var/www/backend
      - ./docker/dev/backend/php.ini:/usr/local/etc/php/php.ini
    restart: always
    container_name: gladkix_backend_dev
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql://gladkix:1234@mysql:3306/gladkix?serverVersion=8.0&charset=utf8mb4"
      APP_ENV: "${APP_ENV:-prod}"
      APP_DEBUG: "${APP_DEBUG:-0}"
    networks:
      - gladkix_network

  db:
    image: mysql:8.4
    restart: always
    volumes:
      - db_data:/var/lib/mysql
#    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gladkix
      MYSQL_USER: gladkix
      MYSQL_PASSWORD: 1234
    container_name: gladkix_db_dev
    networks:
      - gladkix_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gladkix_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: gladkix
      PMA_PASSWORD: 1234
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - gladkix_network

volumes:
  db_data:

networks:
  gladkix_network:
    driver: bridge
