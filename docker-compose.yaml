services:
  backend:
    build:
      context: ./
      dockerfile: ./docker/backend/Dockerfile
    image: gladkix_backend
    ports:
      - 80:80
    volumes:
      - ./portfolio/backend:/app
      - ./docker/backend/php.ini:/usr/local/etc/php/php.ini
      - ./docker/caddy/Caddyfile:/etc/frankenphp/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://gladkix:secret_password_123@db:5432/gladkix_db?serverVersion=16&charset=utf8"
      APP_ENV: "${APP_ENV:-prod}"
      APP_DEBUG: "${APP_DEBUG:-0}"
    networks:
      - gladkix_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gladkix
      POSTGRES_PASSWORD: secret_password_123
      POSTGRES_DB: gladkix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gladkix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gladkix_network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gladkix_network   

volumes:
  postgres_data:
  redis_data:

networks:
  gladkix_network:
    driver: bridge
