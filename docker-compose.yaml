services:
  backend:
    build:
      context: ./
      dockerfile: ./docker/backend/Dockerfile
    image: gladkix_backend
    ports:
      - 7777:80
    volumes:
      - ./portfolio/backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/php.ini
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://gladkix:secret_password_123@db:5432/gladkix_db?serverVersion=16&charset=utf8"
      APP_ENV: "${APP_ENV:-prod}"
      APP_DEBUG: "${APP_DEBUG:-0}"
    networks:
      - gladkix_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gladkix
      POSTGRES_PASSWORD: secret_password_123
      POSTGRES_DB: gladkix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gladkix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gladkix_network       

volumes:
  postgres_data:

networks:
  gladkix_network:
    driver: bridge
